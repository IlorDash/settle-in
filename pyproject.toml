[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immigrant-assist-bot"
version = "0.1.0"
description = "Telegram bot for immigrant assistance in Serbia"
requires-python = ">=3.11"

dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
