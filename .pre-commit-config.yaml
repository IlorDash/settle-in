default_install_hook_types: [pre-commit, commit-msg, prepare-commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1500']  # allow the ~1 MB intent_classifier.joblib

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        additional_dependencies: [Flake8-pyproject]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        entry: python .pre-commit-hooks/run-gitlint-with-err-check.py
        language: python
        stages: [commit-msg]
        pass_filenames: false

  - repo: local
    hooks:
      - id: restore-commit-msg
        name: restore commit message after a failed check
        entry: python .pre-commit-hooks/save-restore-commit-msg.py --restore
        language: system
        stages: [prepare-commit-msg]
        pass_filenames: false
